<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>העלאת תמונה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            text-align: center;
        }

        .box {
            padding: 20px;
            border: 2px dashed #888;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            margin: auto;
        }

        input[type=file] {
            margin: 15px 0;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #msg {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>העלאת תמונה</h2>

    <div class="box">
        <form id="uploadForm" enctype="multipart/form-data" onsubmit="return false;">
            <input type="file" name="file" id="file" accept="image/*" required>
            <br>
            <button type="submit">העלה</button>
        </form>
        <div id="msg"></div>
    </div>

    <script>
        document.getElementById("uploadForm").onsubmit = async (e) => {
            e.preventDefault();

            const formData = new FormData();
            formData.append("file", document.getElementById("file").files[0]);

            let res = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            let data = await res.json();
            document.getElementById("msg").innerText =
                data.success ? "הועלה בהצלחה!" : "שגיאה בהעלאה";
        };
    </script>

</body>

</html>
