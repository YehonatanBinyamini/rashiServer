<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>העלאת תמונה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            text-align: center;
        }

        .box {
            padding: 20px;
            border: 2px dashed #888;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            margin: auto;
        }

        input[type=file] {
            margin: 15px 0;
        }

        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h2>העלאת תמונה</h2>

    <div class="box">
        <form action="/upload-direct" method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <br>
            <button type="submit">העלה</button>
        </form>
    </div>

</body>
</html>
