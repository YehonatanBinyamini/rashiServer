<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>כניסה</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body { text-align: center; margin-top: 60px; font-family: Arial; }
        input { padding: 10px; font-size: 18px; width: 200px; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 18px; }
        p { color: red; margin-top: 15px; }
    </style>
</head>

<body>

<h2>התחברות להעלאת תמונות</h2>

<form method="POST">
    <input type="password" name="password" placeholder="הכנס סיסמה" required>
    <br><br>
    <button type="submit">כניסה</button>
</form>

{% if error %}
<p>{{ error }}</p>
{% endif %}

</body>
</html>
